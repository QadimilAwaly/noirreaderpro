name: Build Windows Executable (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview pythonnet

      - name: Build standalone Windows .exe with PyInstaller
        run: |
          pyinstaller --clean noirreaderpro.spec

      - name: Package release ZIP
        shell: pwsh
        run: |
          mkdir release-pkg
          Copy-Item dist\NoirReaderPro.exe -Destination release-pkg\
          Copy-Item config.json -Destination release-pkg\
          Copy-Item README.md -Destination release-pkg\
          Compress-Archive -Path release-pkg\* -DestinationPath NoirReaderPro-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoirReaderPro-windows-x64
          path: NoirReaderPro-windows-x64.zip

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NoirReaderPro-windows-x64.zip
            dist/NoirReaderPro.exe
          name: Noir Reader Pro Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
